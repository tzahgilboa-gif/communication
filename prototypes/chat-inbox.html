                    '<div class="task-row">' +
                    '<input type="datetime-local" id="taskDue">' +
                    '<select id="taskPrioSel"><option value="normal">עדיפות רגילה</option><option value="high">עדיפות גבוהה</option><option value="low">עדיפות נמוכה</option></select>' +
                    '</div>' +
                    '<div class="task-actions"><span>המשימה נשמרת אצלכם בלבד ולא נשלחת ללקוח</span><button class="primary task" id="taskSave">יצירת משימה</button></div>' +
                    '</div></div>';
            }

            if (mustTemplate) {
                var opts = templates.map(function (t, i) { return '<option value="' + i + '">' + esc(t.label) + '</option>'; }).join('');
                return '<div class="composer">' + tabs +
                    '<div class="template-box">' +
                    '<p><i class="fa-solid fa-circle-info"></i> מחוץ לחלון 24 השעות WhatsApp מאפשרת לשלוח רק תבנית מאושרת. אחרי שהלקוח יענה, אפשר יהיה לשלוח הודעות רגילות וקבצים.</p>' +
                    '<select id="tplSelect">' + opts + '</select>' +
                    '<div class="tpl-preview" id="tplPreview"></div>' +
                    '<div class="tpl-vars" id="tplVars"></div>' +
                    '<div class="tpl-actions"><button class="primary" id="tplSend">שליחת תבנית</button></div>' +
                    '</div></div>';
            }

            var noteMode = mode === 'note';
            var canAttach = !noteMode && c.channel === 'wa';
            var att = state.attachment;
            var attHtml = '';
            if (att && !noteMode) {
                attHtml = '<div class="att-preview">' +
                    (att.type === 'image' ? '<img src="' + esc(att.url) + '" alt="">' : '<div class="pdf"><i class="fa-regular fa-file-pdf"></i></div>') +
                    '<div class="info"><b>' + esc(att.name) + '</b><span>' + fmtSize(att.size) + ' · נשלח ישירות ל-WhatsApp ולא נשמר אצלנו</span></div>' +
                    '<button class="x" id="attRemove" title="הסרת הקובץ" aria-label="הסרת הקובץ"><i class="fa-solid fa-xmark"></i></button></div>';
            }

            var hint = noteMode
                ? '<span>הערה פנימית לא נשלחת ללקוח</span><span></span>'
                : '<span>Enter לשליחה · Shift+Enter לשורה חדשה · <b>/</b> לתשובות מהירות' + (canAttach ? ' · אפשר גם לגרור או להדביק תמונה' : '') + '</span><span id="counter"></span>';

            // WhatsApp formatting toolbar (SMS can't show formatting; internal notes can)
            var fmt = (noteMode || c.channel === 'wa') ? '<div class="fmt-bar" id="fmtBar">' +
                '<button data-fmt="*" title="מודגש" aria-label="מודגש"><b>B</b></button>' +
                '<button data-fmt="_" title="נטוי" aria-label="נטוי"><i>I</i></button>' +
                '<button data-fmt="~" title="קו חוצה" aria-label="קו חוצה"><s>S</s></button>' +
                '<button data-fmt="```" title="כתב מכונה" aria-label="כתב מכונה"><i class="fa-solid fa-code"></i></button>' +
                '</div>' : '';

            return '<div class="composer' + (noteMode ? ' note-mode' : '') + '">' + tabsOpen + fmt + '</div>' + attHtml +
                '<div class="quick" id="quick"></div>' +
                '<div class="emoji-pop" id="emojiPop">' + emojiPickerHtml() + '</div>' +
                '<div class="compose-row">' +
                '<button class="round-btn attach-btn" id="emojiBtn" title="אימוג\'י" aria-label="אימוג\'י"><i class="fa-regular fa-face-smile"></i></button>' +
                (noteMode ? '' : '<button class="round-btn attach-btn" id="attachBtn"' + (canAttach ? '' : ' disabled') +
                    ' title="' + (canAttach ? 'צירוף תמונה (JPG/PNG עד 5MB) או PDF (עד 100MB)' : 'שליחת קבצים זמינה רק ב-WhatsApp') + '" aria-label="צירוף קובץ"><i class="fa-solid fa-paperclip"></i></button>') +
                '<textarea id="msgInput" rows="1" maxlength="4096" placeholder="' + (noteMode ? 'כתבו הערה לעצמכם...' : (att ? 'כיתוב לקובץ (לא חובה)...' : 'כתבו הודעה...')) + '"></textarea>' +
                '<button class="round-btn send-btn" id="sendBtn" title="' + (noteMode ? 'שמירת הערה' : 'שליחה') + '" aria-label="' + (noteMode ? 'שמירת הערה' : 'שליחה') + '"><i class="fa-solid ' + (noteMode ? 'fa-check' : 'fa-paper-plane') + '"></i></button>' +
                '</div>' +
                '<div class="compose-hint">' + hint + '</div>' +
                '</div>';
        }

        // GSM-7 alphabet; anything else (Hebrew, emoji) makes the whole SMS Unicode
        var GSM7 = '@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà';
        var GSM7_EXT = '^{}\\[~]|€'; // count as 2 characters

        function smsSegments(text) {
            var gsm = true, len = 0;
            for (var i = 0; i < text.length; i++) {
                var ch = text[i];
                if (GSM7.indexOf(ch) > -1) len += 1;
                else if (GSM7_EXT.indexOf(ch) > -1) len += 2;
                else { gsm = false; break; }
            }
            if (!gsm) len = text.length; // UTF-16 code units: an emoji counts as 2
            var single = gsm ? 160 : 70, multi = gsm ? 153 : 67;
            return { chars: len, segments: len <= single ? 1 : Math.ceil(len / multi) };
        }

        function smsParts(text) {
            if (!text.length) return '';
            var r = smsSegments(text);
            var billed = Math.ceil(r.segments / SMS_FACTOR);
            var out = r.chars + ' תווים · ' + r.segments + ' ' + (r.segments === 1 ? 'מקטע' : 'מקטעים');
            return out + ' · ' + (billed === 1 ? 'הודעה אחת' : billed + ' הודעות') + ' לחיוב';
        }

        // ---------- attachments (prototype: kept in browser memory only) ----------
        // first bytes of each allowed format; the browser's file.type only reflects the extension
        var MAGIC = { jpeg: [0xFF, 0xD8, 0xFF], png: [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A], pdf: [0x25, 0x50, 0x44, 0x46, 0x2D] };

        function sniff(bytes) {
            for (var k in MAGIC) {
                if (MAGIC[k].every(function (b, i) { return bytes[i] === b; })) return k;
            }
            return null;
        }

        function takeFile(file, c) {
            if (!file) return;
            if (c.channel !== 'wa') { toast('שליחת קבצים זמינה רק ב-WhatsApp'); return; }
            if (windowLeftMin(c) <= 0) { toast('מחוץ לחלון 24 השעות אפשר לשלוח רק תבנית'); return; }
            var type = /^image\/(jpeg|png)$/.test(file.type) ? 'image' : (file.type === 'application/pdf' ? 'pdf' : null);
            if (!type) { toast('אפשר לצרף רק תמונה (JPG/PNG) או PDF'); return; }
            if (!file.size) { toast('הקובץ ריק'); return; }
            if (file.size > LIMITS[type]) { toast(type === 'image' ? 'התמונה גדולה מ-5MB' : 'הקובץ גדול מ-100MB'); return; }

            var convId = c.id;
            var reader = new FileReader();
            reader.onload = function () {
                // the user may have opened another conversation while the file was read: never attach it there
                if (state.selected !== convId) return;
                var real = sniff(new Uint8Array(reader.result));
                var ok = type === 'image' ? (real === 'jpeg' || real === 'png') : real === 'pdf';
                if (!ok) { toast('תוכן הקובץ לא תואם לסוג שלו. אפשר לצרף רק תמונה (JPG/PNG) או PDF אמיתיים'); return; }
                if (state.attachment) URL.revokeObjectURL(state.attachment.url);
                var name = cleanName(file.name) || (type === 'image' ? 'image.' + (real === 'png' ? 'png' : 'jpg') : 'file.pdf');
                state.attachment = { type: type, name: name, size: file.size, url: URL.createObjectURL(file) };
                state.mode = 'reply';
                renderThread();
                focusInput();
            };
            reader.onerror = function () { toast('לא הצלחנו לקרוא את הקובץ'); };
            reader.readAsArrayBuffer(file.slice(0, 8));
        }

        function bindThread(c, left) {
            var th = document.getElementById('thread');

            document.getElementById('backBtn').onclick = function () { document.getElementById('inbox').classList.remove('show-thread'); renderList(); };
            document.getElementById('toggleStatus').onclick = function () {
                c.status = c.status === 'open' ? 'closed' : 'open';
                toast(c.status === 'closed' ? 'השיחה סומנה כסגורה' : 'השיחה נפתחה מחדש');
                renderAll();
            };
            document.getElementById('toggleDetails').onclick = function () { document.getElementById('inbox').classList.toggle('no-details'); };
            var lo = document.getElementById('loadOlder');
            if (lo) lo.onclick = function () {
                if (state.loadingOlder) return;
                state.loadingOlder = c.id;
                renderThread();
                fetchOlderMessages(c, function (older) {
                    state.loadingOlder = null;
                    // the user may have opened another conversation meanwhile: the messages go to c only
                    Array.prototype.unshift.apply(c.messages, older);
                    if (state.selected !== c.id) return;
                    // keep the message the user was looking at in place while older ones appear above it
                    var box = document.getElementById('messages');
                    var fromBottom = box.scrollHeight - box.scrollTop;
                    renderThread();
                    box = document.getElementById('messages');
                    box.scrollTop = box.scrollHeight - fromBottom;
                    toast(older.length ? 'נטענו ' + older.length + ' הודעות קודמות' : 'אין הודעות קודמות');
                });
            };

            var oq = document.getElementById('optOutQuick');
            if (oq) oq.onclick = function () { optOut(c); };
            document.getElementById('pinToggle').onclick = function () { if (c.pin) unpinConv(c.id); else pinConv(c.id); };

            Array.prototype.forEach.call(th.querySelectorAll('.ctab'), function (b) {
                b.onclick = function () { state.mode = b.getAttribute('data-mode'); if (state.mode !== 'task') state.taskPrefill = ''; renderThread(); focusInput(); };
            });

            // timeline actions: task checkbox, message -> task, image zoom
            document.getElementById('messages').onclick = function (e) {
                var tg = e.target.closest('[data-toggletask]');
                if (tg) { toggleTask(+tg.getAttribute('data-toggletask')); return; }
                var mt = e.target.closest('[data-msgtask]');
                if (mt) {
                    var m = c.messages[+mt.getAttribute('data-msgtask')];
                    state.mode = 'task';
                    state.taskPrefill = (m.text || (m.media ? m.media.name : '')).replace(/\s+/g, ' ').slice(0, 120);
                    renderThread();
                    var ti = document.getElementById('taskTitle');
                    ti.focus(); ti.select();
                    return;
                }
                var z = e.target.closest('[data-zoom]');
                if (z) {
                    var lb = document.createElement('div');
                    lb.className = 'lightbox';
                    var big = document.createElement('img');
                    big.src = z.getAttribute('src');
                    big.alt = '';
                    lb.appendChild(big);
                    var closeLb = function (ev) { if (!ev.key || ev.key === 'Escape') { lb.remove(); document.removeEventListener('keydown', closeLb); } };
                    lb.onclick = closeLb;
                    document.addEventListener('keydown', closeLb);
                    document.body.appendChild(lb);
                }
            };

            // drag & drop file onto the thread
            var dragDepth = 0;
            th.ondragenter = function (e) {
                if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') === -1) return;
                e.preventDefault();
                if (dragDepth++ === 0 && c.channel === 'wa' && left > 0) {
                    var h = document.createElement('div');
                    h.className = 'drop-hint'; h.id = 'dropHint';
                    h.innerHTML = '<div><i class="fa-solid fa-cloud-arrow-up"></i> שחררו כאן כדי לצרף</div>';
                    th.appendChild(h);
                }
            };
            th.ondragover = function (e) { e.preventDefault(); };
            th.ondragleave = function () { if (--dragDepth <= 0) { dragDepth = 0; var h = document.getElementById('dropHint'); if (h) h.remove(); } };
            th.ondrop = function (e) {
                e.preventDefault(); dragDepth = 0;
                var h = document.getElementById('dropHint'); if (h) h.remove();
                if (e.dataTransfer.files.length) takeFile(e.dataTransfer.files[0], c);
            };

            // ----- task mode -----
            if (state.mode === 'task') { bindTaskForm(c); return; }

            // ----- template mode -----
            var tplSelect = document.getElementById('tplSelect');
            if (tplSelect) { bindTemplate(c, tplSelect); return; }

            // ----- reply / note -----
            var input = document.getElementById('msgInput');
            var quick = document.getElementById('quick');
            var attachBtn = document.getElementById('attachBtn');
            var fileInput = document.getElementById('fileInput');

            if (attachBtn) attachBtn.onclick = function () { fileInput.value = ''; fileInput.click(); };

            // insert at the cursor (or wrap the selection) and keep typing
            var insertAt = function (before, after) {
                var a = input.selectionStart, b = input.selectionEnd, v = input.value;
                if (v.length - (b - a) + before.length + (after || '').length > 4096) { toast('ההודעה ארוכה מדי'); return; }
                input.value = v.slice(0, a) + before + v.slice(a, b) + (after || '') + v.slice(b);
                input.selectionStart = a + before.length;
                input.selectionEnd = b + before.length;
                input.focus();
                input.oninput();
            };

            var emojiPop = document.getElementById('emojiPop');
            var emojiBtn = document.getElementById('emojiBtn');
            emojiBtn.onmousedown = function (e) { e.preventDefault(); }; // keep the cursor in the textarea
            emojiBtn.onclick = function () { emojiPop.classList.toggle('show'); };
            emojiPop.onmousedown = function (e) { e.preventDefault(); }; // keep the textarea selection
            emojiPop.onclick = function (e) {
                var b = e.target.closest('[data-emoji]');
                if (b) { insertAt(b.getAttribute('data-emoji')); rememberEmoji(b.getAttribute('data-emoji')); return; }
                // category tab: jump to its section
                var tab = e.target.closest('[data-ecat]');
                if (tab) {
                    var sec = emojiPop.querySelector('[data-sec="' + tab.getAttribute('data-ecat') + '"]');
                    document.getElementById('emojiBody').scrollTop = sec.offsetTop - document.getElementById('emojiBody').offsetTop;
                }
            };

            // scrolling highlights the category being shown, like on a phone
            document.getElementById('emojiBody').onscroll = function () {
                var body = this, cur = null;
                Array.prototype.forEach.call(body.querySelectorAll('.emoji-sec'), function (sec) {
                    if (sec.offsetTop - body.offsetTop <= body.scrollTop + 4) cur = sec.getAttribute('data-sec');
                });
                Array.prototype.forEach.call(emojiPop.querySelectorAll('[data-ecat]'), function (t) {
                    t.classList.toggle('active', t.getAttribute('data-ecat') === cur);
                });
            };

            var fmtBar = document.getElementById('fmtBar');
            if (fmtBar) {
                fmtBar.onmousedown = function (e) { e.preventDefault(); };
                fmtBar.onclick = function (e) {
                    var b = e.target.closest('[data-fmt]');
                    if (b) insertAt(b.getAttribute('data-fmt'), b.getAttribute('data-fmt'));
                };
            }
            fileInput.onchange = function () { takeFile(fileInput.files[0], c); };
            var rm = document.getElementById('attRemove');
            if (rm) rm.onclick = function () { URL.revokeObjectURL(state.attachment.url); state.attachment = null; renderThread(); focusInput(); };

            input.onpaste = function (e) {
                if (state.mode !== 'reply') return;
                var items = (e.clipboardData && e.clipboardData.items) || [];
                for (var i = 0; i < items.length; i++) {
                    if (items[i].kind === 'file') { e.preventDefault(); takeFile(items[i].getAsFile(), c); return; }
                }
            };

            var send = function () {
                var text = input.value.trim();
                if (state.mode === 'note') {
                    if (!text) return;
                    c.messages.push({ note: true, text: text, time: new Date() });
                    state.stickBottom = true;
                    toast('ההערה נשמרה');
                } else {
                    if (!text && !state.attachment) return;
                    var msg = { dir: 'out', text: text, time: new Date(), status: 'sent' };
                    if (state.attachment) { msg.media = state.attachment; state.attachment = null; }
                    c.messages.push(msg);
                    state.stickBottom = true;
                    setTimeout(function () { msg.status = 'delivered'; if (state.selected === c.id) renderThread(); }, 1500);
                    setTimeout(function () { msg.status = 'read'; if (state.selected === c.id) renderThread(); }, 3500);
                }
                c.unread = 0;
                input.value = '';
                renderAll();
                focusInput();
            };

            var showQuick = function (filter) {
                var items = quickReplies.filter(function (q) { return !filter || q.key.indexOf(filter) === 0 || q.text.indexOf(filter) > -1; });
                if (!items.length) { quick.classList.remove('show'); return; }
                state.quickIdx = Math.min(state.quickIdx, items.length - 1);
                quick.innerHTML = '<div class="quick-head">תשובות מהירות · חצים לבחירה, Enter להוספה</div>' +
                    items.map(function (q, i) {
                        return '<div class="quick-item' + (i === state.quickIdx ? ' hl' : '') + '" data-i="' + quickReplies.indexOf(q) + '"><b>/' + esc(q.key) + '</b><span>' + esc(q.text) + '</span></div>';
                    }).join('');
                quick.classList.add('show');
                Array.prototype.forEach.call(quick.querySelectorAll('.quick-item'), function (el) {
                    el.onmousedown = function (e) {
                        e.preventDefault();
                        input.value = quickReplies[el.getAttribute('data-i')].text;
                        quick.classList.remove('show');
                        input.oninput();
                    };
                });
            };

            input.oninput = function () {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 140) + 'px';
                if (state.mode === 'reply' && input.value.indexOf('/') === 0) showQuick(input.value.slice(1));
                else quick.classList.remove('show');
                var counter = document.getElementById('counter');
                if (counter) counter.textContent = c.channel === 'sms' ? smsParts(input.value) : '';
            };

            input.onkeydown = function (e) {
                var open = quick.classList.contains('show');
                if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
                    e.preventDefault();
                    var n = quick.querySelectorAll('.quick-item').length;
                    state.quickIdx = (state.quickIdx + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
                    showQuick(input.value.slice(1));
                    return;
                }
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (open) {
                        var hl = quick.querySelector('.quick-item.hl');
                        if (hl) { input.value = quickReplies[hl.getAttribute('data-i')].text; quick.classList.remove('show'); input.oninput(); }
                        return;
                    }
                    send();
                }
                if (e.key === 'Escape') { quick.classList.remove('show'); emojiPop.classList.remove('show'); }
            };

            input.onblur = function () { setTimeout(function () { quick.classList.remove('show'); }, 100); };
            document.getElementById('sendBtn').onclick = send;
            input.oninput(); // show the SMS cost line right away
        }

        function bindTemplate(c, tplSelect) {
            var drawTpl = function () {
                var t = templates[tplSelect.value];
                var count = (t.body.match(/\{\{\d+\}\}/g) || []).length;
                var vars = '';
                for (var i = 1; i <= count; i++) {
                    vars += '<input data-v="' + i + '" placeholder="משתנה ' + i + '"' + (i === 1 ? ' value="' + esc(c.name.split(' ')[0]) + '"' : '') + '>';
                }
                document.getElementById('tplVars').innerHTML = vars;
                var upd = function () {
                    var body = t.body;
                    Array.prototype.forEach.call(document.querySelectorAll('#tplVars input'), function (inp) {
                        var val = inp.value || '{{' + inp.getAttribute('data-v') + '}}';
                        body = body.replace('{{' + inp.getAttribute('data-v') + '}}', function () { return val; });
                    });
                    document.getElementById('tplPreview').textContent = body;
                    return body;
                };
                Array.prototype.forEach.call(document.querySelectorAll('#tplVars input'), function (inp) { inp.oninput = upd; });
                upd();
                document.getElementById('tplSend').onclick = function () {
                    var empty = Array.prototype.some.call(document.querySelectorAll('#tplVars input'), function (inp) { return !inp.value.trim(); });
                    if (empty) { toast('יש למלא את כל המשתנים בתבנית'); return; }
                    c.messages.push({ dir: 'out', text: upd(), time: new Date(), status: 'sent', srcLabel: 'תבנית: ' + t.label });
                    state.stickBottom = true;
                    toast('התבנית נשלחה');
                    renderAll();
                };
            };
            tplSelect.onchange = drawTpl;
            drawTpl();
        }

        function toLocalInput(d) {
            var p = function (n) { return (n < 10 ? '0' : '') + n; };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
        }

        function bindTaskForm(c) {
            var due = document.getElementById('taskDue');
            var chips = document.getElementById('dueChips');

            chips.onclick = function (e) {
                var b = e.target.closest('[data-due]');
                if (!b) return;
                Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (x) { x.classList.remove('active'); });
                b.classList.add('active');
                var k = b.getAttribute('data-due'), d = new Date();
                if (k === 'none') { due.value = ''; return; }
                if (k === 'today') { var h = Math.max(d.getHours() + 2, 17); if (h > 23) d.setHours(23, 59, 0, 0); else d.setHours(h, 0, 0, 0); }
                if (k === 'tomorrow') { d.setDate(d.getDate() + 1); d.setHours(10, 0, 0, 0); }
                if (k === '3d') { d.setDate(d.getDate() + 3); d.setHours(10, 0, 0, 0); }
                if (k === 'week') { d.setDate(d.getDate() + 7); d.setHours(10, 0, 0, 0); }
                due.value = toLocalInput(d);
            };

            due.oninput = function () {
                Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (x) { x.classList.remove('active'); });
            };

            var save = function () {
                var title = document.getElementById('taskTitle').value.trim();
                if (!title) { toast('כתבו מה צריך לעשות'); document.getElementById('taskTitle').focus(); return; }
                tasks.push({
                    id: tasks.length ? Math.max.apply(null, tasks.map(function (t) { return t.id; })) + 1 : 1,
                    convId: c.id, title: title, due: due.value ? new Date(due.value) : null,
                    prio: document.getElementById('taskPrioSel').value, done: false, created: new Date()
                });
                state.taskPrefill = '';
                state.mode = 'reply';
                toast('המשימה נוצרה');
                renderAll();
            };

            document.getElementById('taskSave').onclick = save;
            document.getElementById('taskTitle').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); save(); } };
        }

        function toggleTask(id) {
            var t = tasks.filter(function (x) { return x.id === id; })[0];
            t.done = !t.done;
            t.doneAt = t.done ? new Date() : null;
            toast(t.done ? 'המשימה סומנה כבוצעה' : 'המשימה נפתחה מחדש');
            renderAll();
        }

        function isMobile() { return window.matchMedia('(max-width: 760px)').matches; }

        // the user can actually see this conversation right now
        function threadVisible(id) {
            return state.view === 'inbox' && state.selected === id &&
                (!isMobile() || document.getElementById('inbox').classList.contains('show-thread'));
        }

        function focusInput() {
            var i = document.getElementById('msgInput') || document.getElementById('taskTitle');
            if (i) i.focus();
        }

        // ======================================================================
        // details panel
        // ======================================================================
        function renderDetails() {
            var c = convById(state.selected);
            var d = document.getElementById('details');
            if (!c) { d.innerHTML = ''; return; }

            var outCount = c.messages.filter(function (m) { return m.dir === 'out'; }).length;
            var inCount = c.messages.filter(function (m) { return m.dir === 'in'; }).length;
            var ct = tasks.filter(function (t) { return t.convId === c.id; }).sort(function (a, b) { return a.done - b.done || (a.due || 8e15) - (b.due || 8e15); });

            d.innerHTML =
                '<div class="d-head"><div class="avatar">' + initials(c.name) + '</div>' +
                '<div class="name">' + esc(c.name) + '</div>' +
                '<div class="phone"><span class="ltr">' + esc(c.phone) + '</span></div></div>' +

                '<div class="d-sec"><h3>משימות <button id="dAddTask"><i class="fa-solid fa-plus"></i> משימה חדשה</button></h3>' +
                (ct.length ? ct.map(function (t) {
                    return '<div class="mini-task"><button class="chk' + (t.done ? ' on' : '') + '" data-toggletask="' + t.id + '" aria-label="' + (t.done ? 'סימון כפתוחה' : 'סימון כבוצעה') + '"><i class="fa-solid fa-check"></i></button>' +
                        '<div><div' + (t.done ? ' style="text-decoration:line-through;color:var(--muted)"' : '') + '>' + esc(t.title) + '</div><div class="t-sub">' + dueLabel(t) + '</div></div></div>';
                }).join('') : '<span style="color:var(--muted);font-size:13px">אין משימות לאיש הקשר</span>') +
                '</div>' +

                '<div class="d-sec"><h3>קבוצות</h3><div class="groups">' +
                (c.groups.length ? c.groups.map(function (g) { return '<span class="group">' + esc(g) + '</span>'; }).join('') : '<span style="color:var(--muted);font-size:13px">לא משויך לקבוצה</span>') +
                '</div></div>' +

                '<div class="d-sec"><h3>פעילות</h3>' +
                '<div class="kv"><span>ערוץ</span><span>' + (c.channel === 'wa' ? 'WhatsApp' : 'SMS') + '</span></div>' +
                '<div class="kv"><span>קמפיין אחרון</span><span>' + esc(c.lastCampaign) + '</span></div>' +
                '<div class="kv"><span>הודעות שנשלחו</span><span>' + outCount + '</span></div>' +
                '<div class="kv"><span>תגובות מהלקוח</span><span>' + inCount + '</span></div>' +
                '</div>' +

                '<div class="d-sec"><h3>הסרה מדיוור</h3>' +
                (c.optedOut
                    ? '<div style="color:var(--danger);font-size:13px"><i class="fa-solid fa-ban"></i> הוסר מרשימת התפוצה</div>'
                    : '<button class="danger-btn" id="optOut"><i class="fa-solid fa-ban"></i> הסרה מרשימת התפוצה</button>') +
                '</div>';

            d.onclick = function (e) {
                var tg = e.target.closest('[data-toggletask]');
                if (tg) toggleTask(+tg.getAttribute('data-toggletask'));
            };

            document.getElementById('dAddTask').onclick = function () { state.mode = 'task'; state.taskPrefill = ''; renderThread(); focusInput(); };

            var b = document.getElementById('optOut');
            if (b) b.onclick = function () {
                if (!confirm('להסיר את ' + c.name + ' מרשימת התפוצה? לא יישלחו אליו יותר קמפיינים.')) return;
                optOut(c);
            };
        }

        // ======================================================================
        // tasks view (all customers)
        // ======================================================================
        function renderTasksView() {
            var n = new Date();
            var open = tasks.filter(function (t) { return !t.done; });
            var stats = {
                open: open.length,
                late: open.filter(function (t) { return taskState(t) === 'late'; }).length,
                today: open.filter(function (t) { return taskState(t) === 'today'; }).length,
                done: tasks.filter(function (t) { return t.done; }).length
            };

            document.getElementById('taskStats').innerHTML =
                '<div class="stat" data-tf="open"><div class="n">' + stats.open + '</div><div class="l">משימות פתוחות</div></div>' +
                '<div class="stat late" data-tf="late"><div class="n">' + stats.late + '</div><div class="l">באיחור</div></div>' +
                '<div class="stat today" data-tf="today"><div class="n">' + stats.today + '</div><div class="l">להיום</div></div>' +
                '<div class="stat" data-tf="done"><div class="n">' + stats.done + '</div><div class="l">בוצעו</div></div>';

            var q = state.taskSearch.trim();
            var weekEnd = addDays(n, 7);
            var list = tasks.filter(function (t) {
                var s = taskState(t);
                if (state.taskFilter === 'open' && t.done) return false;
                if (state.taskFilter === 'late' && s !== 'late') return false;
                if (state.taskFilter === 'today' && s !== 'today') return false;
                if (state.taskFilter === 'week' && (t.done || !t.due || t.due > weekEnd)) return false;
                if (state.taskFilter === 'done' && !t.done) return false;
                if (state.taskPrio !== 'all' && t.prio !== state.taskPrio) return false;
                if (q) {
                    var c = convById(t.convId);
                    if ((t.title + ' ' + c.name + ' ' + c.phone).indexOf(q) === -1) return false;
                }
                return true;
            });

            var prioRank = { high: 0, normal: 1, low: 2 };
            list.sort(function (a, b) {
                if (a.done !== b.done) return a.done - b.done;
                var da = a.due ? a.due.getTime() : 8e15, db = b.due ? b.due.getTime() : 8e15;
                return da - db || prioRank[a.prio] - prioRank[b.prio];
            });

            var groups = [
                { key: 'late', label: 'באיחור', cls: 'late' },
                { key: 'today', label: 'היום' },
                { key: 'tomorrow', label: 'מחר' },
                { key: 'later', label: 'בהמשך' },
                { key: 'nodate', label: 'ללא תאריך יעד' },
                { key: 'done', label: 'בוצעו' }
            ];

            var html = '';
            groups.forEach(function (g) {
                var items = list.filter(function (t) { return taskState(t) === g.key; });
                if (!items.length) return;
                html += '<div class="t-group"><h4 class="' + (g.cls || '') + '">' + g.label + ' (' + items.length + ')</h4>';
                items.forEach(function (t) {
                    var c = convById(t.convId);
                    html += '<div class="t-row' + (t.done ? ' done' : '') + '">' +
                        '<button class="chk' + (t.done ? ' on' : '') + '" data-toggletask="' + t.id + '" title="' + (t.done ? 'סימון כפתוחה' : 'סימון כבוצעה') + '" aria-label="' + (t.done ? 'סימון כפתוחה' : 'סימון כבוצעה') + '"><i class="fa-solid fa-check"></i></button>' +
                        '<div class="t-main"><div class="t-title">' + esc(t.title) + '</div>' +
                        '<div class="t-sub">' +
                        '<span class="contact-link" data-openconv="' + c.id + '"><i class="' + (c.channel === 'wa' ? 'fa-brands fa-whatsapp' : 'fa-solid fa-comment-sms') + '"></i> ' + esc(c.name) + '</span>' +
                        dueLabel(t) + prioTag(t.prio) +
                        (t.done && t.doneAt ? '<span>בוצע ' + t.doneAt.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' }) + '</span>' : '') +
                        '</div></div>' +
                        '<div class="acts">' +
                        '<button class="icon-btn" data-openconv="' + c.id + '" title="מעבר לשיחה" aria-label="מעבר לשיחה"><i class="fa-regular fa-comments"></i></button>' +
                        '<button class="icon-btn" data-deltask="' + t.id + '" title="מחיקת משימה" aria-label="מחיקת משימה"><i class="fa-regular fa-trash-can"></i></button>' +
                        '</div></div>';
                });
                html += '</div>';
            });

            document.getElementById('taskList').innerHTML = html || '<div class="empty-list">אין משימות שמתאימות לסינון</div>';
        }

        document.getElementById('viewTasks').onclick = function (e) {
            var st = e.target.closest('.stat[data-tf]');
            if (st) { setTaskFilter(st.getAttribute('data-tf')); return; }
            var tg = e.target.closest('[data-toggletask]');
            if (tg) { toggleTask(+tg.getAttribute('data-toggletask')); return; }
            var oc = e.target.closest('[data-openconv]');
            if (oc) { switchView('inbox'); openConv(+oc.getAttribute('data-openconv')); return; }
            var del = e.target.closest('[data-deltask]');
            if (del && confirm('למחוק את המשימה?')) {
                tasks = tasks.filter(function (t) { return t.id !== +del.getAttribute('data-deltask'); });
                toast('המשימה נמחקה');
                renderAll();
            }
        };

        function setTaskFilter(f) {
            state.taskFilter = f;
            Array.prototype.forEach.call(document.querySelectorAll('#taskFilters .chip'), function (x) {
                x.classList.toggle('active', x.getAttribute('data-tf') === f);
            });
            renderTasksView();
        }

        document.getElementById('taskFilters').onclick = function (e) {
            var b = e.target.closest('.chip');
            if (b) setTaskFilter(b.getAttribute('data-tf'));
        };

        document.getElementById('taskSearch').oninput = function () { state.taskSearch = this.value; renderTasksView(); };
        document.getElementById('taskPrio').onchange = function () { state.taskPrio = this.value; renderTasksView(); };

        // ======================================================================
        // global
        // ======================================================================
        function renderCounts() {
            var unread = convs.reduce(function (s, c) { return s + (c.unread ? 1 : 0); }, 0);
            var open = tasks.filter(function (t) { return !t.done; });
            var late = open.filter(function (t) { return taskState(t) === 'late'; }).length;
            var cu = document.getElementById('cntUnread'), ct = document.getElementById('cntTasks');
            cu.textContent = unread || '';
            cu.style.display = unread ? '' : 'none';
            ct.textContent = open.length;
            var cl = document.getElementById('cntLate');
            cl.textContent = late + ' באיחור';
            cl.style.display = late ? '' : 'none';
        }

        function renderAll() {
            renderList();
            renderThread();
            renderDetails();
            if (state.view === 'tasks') renderTasksView();
        }

        function switchView(v) {
            state.view = v;
            document.getElementById('viewInbox').classList.toggle('hidden', v !== 'inbox');
            document.getElementById('viewTasks').classList.toggle('hidden', v !== 'tasks');
            Array.prototype.forEach.call(document.querySelectorAll('.ttab'), function (t) {
                t.classList.toggle('active', t.getAttribute('data-view') === v);
            });
            if (v === 'tasks') renderTasksView();
            var sel = convById(state.selected);
            if (sel && sel.unread && threadVisible(sel.id)) { sel.unread = 0; renderList(); }
        }

        Array.prototype.forEach.call(document.querySelectorAll('.ttab'), function (t) {
            t.onclick = function () { switchView(t.getAttribute('data-view')); };
        });

        function openConv(id) {
            if (state.selected !== id && state.attachment) { URL.revokeObjectURL(state.attachment.url); state.attachment = null; }
            state.selected = id;
            state.mode = 'reply';
            state.taskPrefill = '';
            convById(id).unread = 0;
            var ib = document.getElementById('inbox');
            ib.classList.add('show-thread');
            ib.classList.remove('nothing');
            renderAll();
            if (!isMobile()) focusInput(); // on a phone this would pop the keyboard over the conversation
        }

        // keyboard: Enter or Space opens the focused conversation
        document.getElementById('convList').onkeydown = function (e) {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('conv')) {
                e.preventDefault();
                openConv(+e.target.getAttribute('data-id'));
            }
        };

        document.getElementById('convList').onclick = function (e) {
            var p = e.target.closest('[data-pin]');
            if (p) { e.stopPropagation(); pinConv(+p.getAttribute('data-pin')); return; }
            var pm = e.target.closest('[data-pinmenu]');
            if (pm) { var id = +pm.getAttribute('data-pinmenu'); state.pinMenu = state.pinMenu === id ? null : id; renderList(); return; }
            var to = e.target.closest('[data-pinto]');
            if (to) { movePin(+to.getAttribute('data-conv'), +to.getAttribute('data-pinto')); return; }
            var up = e.target.closest('[data-unpin]');
            if (up) { unpinConv(+up.getAttribute('data-unpin')); return; }
            if (state.pinMenu) { state.pinMenu = null; renderList(); }
            var el = e.target.closest('.conv');
            if (el) openConv(+el.getAttribute('data-id'));
        };

        document.addEventListener('click', function (e) {
            var ep = document.getElementById('emojiPop');
            if (ep && ep.classList.contains('show') && !e.target.closest('#emojiPop') && !e.target.closest('#emojiBtn')) ep.classList.remove('show');
            if (state.pinMenu && !e.target.closest('.pin-menu') && !e.target.closest('[data-pinmenu]')) { state.pinMenu = null; renderList(); }
        });

        document.getElementById('search').oninput = function () { state.search = this.value; renderList(); };

        function bindChips(containerId, key, attr) {
            var box = document.getElementById(containerId);
            box.onclick = function (e) {
                var b = e.target.closest('.chip');
                if (!b) return;
                Array.prototype.forEach.call(box.querySelectorAll('.chip'), function (x) { x.classList.remove('active'); });
                b.classList.add('active');
                state[key] = b.getAttribute(attr);
                renderList();
            };
        }

        bindChips('statusFilters', 'statusFilter', 'data-f');
        bindChips('channelFilters', 'channelFilter', 'data-c');

        // demo: a new inbound message arrives after 20 seconds (simulates polling)
        setTimeout(function () {
            var c = convs[1];
            c.messages.push({ dir: 'in', text: 'עוד שאלה קטנה, אפשר לקבל את החשבונית גם בתור קישור? למשל www.example.co.il/invoice', time: new Date() });
            if (!threadVisible(c.id)) c.unread++;
            toast('הודעה חדשה מ' + c.name);
            renderList();
            if (state.selected === c.id) renderThread();
        }, 20000);

        // every minute: refresh reply-window timers, "today"/"late" labels and counts
        setInterval(function () {
            renderList();
            if (state.view === 'tasks') renderTasksView();
            var c = convById(state.selected);
            if (!c || c.channel !== 'wa') return;
            var left = windowLeftMin(c);
            if ((left > 0) !== state.windowOpen) renderThread(); // window just closed: switch to templates
            else if (document.getElementById('windowLeft')) document.getElementById('windowLeft').textContent = fmtLeft(left);
        }, 60000);

        buildGPattern();
        renderList();
    </script>
</body>
</html>
