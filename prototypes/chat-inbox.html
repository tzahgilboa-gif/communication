<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תיבת שיחות - אב-טיפוס</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #f0f2f5;
            --panel: #ffffff;
            --border: #e3e6ea;
            --text: #1c2b3a;
            --muted: #6b7785;
            --accent: #1877f2;
            --accent-soft: #e7f0fe;
            --brand: #7a0a7f;
            --brand-soft: #f4e8f5;
            --pin: #b45f00;
            --pin-soft: #fff1d6;
            --pin-border: #f3cf86;
            --wa: #128c7e;
            --wa-soft: #e3f4f1;
            --sms: #5b6b7d;
            --sms-soft: #edf0f3;
            --out-bubble: #d9fdd3;
            --in-bubble: #ffffff;
            --danger: #d93025;
            --danger-soft: #fdecea;
            --warn: #b26a00;
            --warn-soft: #fff4e0;
            --task: #2e5bba;
            --task-soft: #eaf0fc;
            --radius: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Heebo', Arial, sans-serif;
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
            height: 100vh;
            height: 100dvh; /* mobile: excludes the browser's address bar */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        button { font-family: inherit; cursor: pointer; }
        input, textarea, select { font-family: inherit; font-size: 14px; color: var(--text); }
        a { color: var(--accent); }

        .proto-banner { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 12px; padding: 4px 8px; }

        /* ---------- top tabs ---------- */
        .topbar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 14px;
            height: 46px;
            flex-shrink: 0;
        }

        .topbar h1 { font-size: 17px; font-weight: 700; margin-inline-end: 18px; }

        .ttab {
            border: 0;
            background: transparent;
            height: 46px;
            padding: 0 14px;
            font-size: 14px;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .ttab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

        .count {
            background: var(--sms-soft);
            color: var(--sms);
            border-radius: 10px;
            font-size: 12px;
            padding: 0 7px;
            min-width: 20px;
            text-align: center;
        }

        .count.alert { background: var(--danger); color: #fff; }

        .load-older { align-self: center; margin: 4px 0 8px; }
        .load-older button { border: 1px solid var(--border); background: #ffffffe6; color: var(--accent); border-radius: 16px; height: 30px; padding: 0 14px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .load-older button:disabled { color: var(--muted); cursor: default; }
        .history-start { align-self: center; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }

        .live { margin-inline-start: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #34c759; }

        .view { flex: 1; min-height: 0; }
        .hidden { display: none !important; }

        /* ---------- inbox layout ---------- */
        .inbox { display: grid; grid-template-columns: 340px minmax(0, 1fr) 300px; height: 100%; }
        .inbox.no-details, .inbox.nothing { grid-template-columns: 340px minmax(0, 1fr); }
        .inbox.no-details .details, .inbox.nothing .details { display: none; }

        /* ---------- conversation list ---------- */
        .list { background: var(--panel); border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
        .list-head { padding: 12px 14px 8px; border-bottom: 1px solid var(--border); }

        .search { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 8px; padding: 0 10px; height: 36px; }
        .search i { color: var(--muted); }
        .search input { border: 0; background: transparent; outline: none; width: 100%; }

        .filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

        .chip { border: 1px solid var(--border); background: var(--panel); border-radius: 16px; padding: 3px 12px; font-size: 13px; color: var(--muted); }
        .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }

        .conv-list { overflow-y: auto; flex: 1; }

        .sec-label {
            font-size: 12px;
            color: var(--muted);
            padding: 8px 14px 4px;
            display: flex; align-items: center; gap: 6px;
            background: #fafbfc;
            border-bottom: 1px solid var(--border);
        }

        .conv { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; position: relative; }
        .conv:hover { background: #f7f8fa; }
        .conv.selected { background: var(--accent-soft); }
        .conv.pinned { background: #fffaf0; }
        .conv.pinned.selected { background: var(--accent-soft); }

        .avatar {
            width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-weight: 500; background: #dfe7f1; color: #2d4a6b; position: relative;
        }

        .avatar .ch {
            position: absolute; bottom: -2px; inset-inline-start: -2px;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #fff; border: 2px solid var(--panel);
        }

        .ch.wa { background: var(--wa); }
        .ch.sms { background: var(--sms); }

        .conv-main { flex: 1; min-width: 0; }
        .conv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .conv-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-time { font-size: 12px; color: var(--muted); flex-shrink: 0; }
        .conv.unread .conv-time { color: var(--accent); font-weight: 500; }
        .conv-preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; unicode-bidi: plaintext; text-align: start; }
        .conv.unread .conv-preview { color: var(--text); }

        .badge {
            background: var(--accent); color: #fff; border-radius: 10px;
            min-width: 20px; height: 20px; padding: 0 6px; font-size: 12px;
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .conv-meta { display: flex; gap: 6px; margin-top: 4px; font-size: 11px; flex-wrap: wrap; }
        .tag { border-radius: 4px; padding: 1px 6px; background: var(--sms-soft); color: var(--sms); }
        .tag.window { background: var(--wa-soft); color: var(--wa); }
        .tag.closed { background: #eceff1; color: #78838f; }
        .tag.tasks { background: var(--task-soft); color: var(--task); }
        .tag.tasks.late { background: var(--danger-soft); color: var(--danger); }
        .tag.optout { background: var(--danger-soft); color: var(--danger); }

        /* pin controls */
        .pin-btn {
            position: absolute; top: 8px; inset-inline-end: 10px;
            border: 0; background: transparent; color: #a8b1bb;
            width: 26px; height: 26px; border-radius: 6px; display: none;
        }

        .conv:hover .pin-btn { display: block; }

        /* touch screens have no hover: always show the pin button */
        @media (hover: none) {
            .pin-btn { display: block; }
            .conv:not(.pinned) .conv-time { margin-inline-end: 30px; }
        }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .pin-btn:hover { background: var(--pin-soft); color: var(--pin); }

        .pin-num {
            position: absolute; top: 8px; inset-inline-end: 10px;
            border: 1px solid var(--pin-border); background: var(--pin-soft); color: var(--pin);
            height: 22px; border-radius: 11px; padding: 0 8px;
            font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;
        }

        .pin-num:hover { background: #ffe6b3; }

        .pin-menu {
            position: absolute; top: 34px; inset-inline-end: 10px; z-index: 20;
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12); overflow: hidden; min-width: 150px;
        }

        .pin-menu div { padding: 7px 12px; font-size: 13px; cursor: pointer; }
        .pin-menu div:hover { background: var(--accent-soft); }
        .pin-menu div.cur { font-weight: 500; color: var(--pin); }
        .pin-menu div.unpin { border-top: 1px solid var(--border); color: var(--danger); }

        .conv.pinned .conv-time { margin-inline-end: 52px; }

        .empty-list { padding: 30px 20px; text-align: center; color: var(--muted); }

        /* ---------- thread ---------- */
        .thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #f4f1ec; position: relative; }

        .thread-head { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
        .thread-head .who { flex: 1; min-width: 0; }
        .thread-head .who .name, .thread-head .who .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .thread-head .who .name { font-weight: 500; font-size: 15px; }
        .thread-head .who .sub { font-size: 12px; color: var(--muted); }

        .icon-btn {
            border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
            height: 34px; padding: 0 12px; color: var(--text);
            display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
        }

        .icon-btn:hover { background: #f5f6f8; }
        .icon-btn.back { display: none; }
        .icon-btn.on { color: var(--pin); border-color: var(--pin-border); background: var(--pin-soft); }
        .sec-label .fa-thumbtack { color: var(--pin); }

        .window-bar { font-size: 13px; padding: 6px 16px; display: flex; align-items: center; gap: 8px; }
        .window-bar.open { background: var(--wa-soft); color: var(--wa); }
        .window-bar.closed { background: var(--warn-soft); color: var(--warn); }
        .window-bar.sms { background: var(--sms-soft); color: var(--sms); }
        .window-bar.optout { background: var(--danger-soft); color: var(--danger); }
        .window-bar.suggest { background: var(--warn-soft); color: var(--warn); }
        .window-bar button { margin-inline-start: auto; border: 1px solid currentColor; background: var(--panel); color: inherit; border-radius: 6px; height: 26px; padding: 0 10px; font-size: 12px; }

        .messages {
            flex: 1; overflow-y: auto; padding: 16px 6%;
            display: flex; flex-direction: column; gap: 4px;
            background-repeat: repeat;
            background-size: 260px 260px;
        }

        .day { align-self: center; background: #ffffffd9; color: var(--muted); font-size: 12px; border-radius: 8px; padding: 3px 10px; margin: 10px 0 6px; }

        .msg {
            max-width: 65%; padding: 7px 10px 5px; border-radius: var(--radius);
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); line-height: 1.5;
            white-space: pre-wrap; word-wrap: break-word; unicode-bidi: plaintext;
            position: relative;
        }

        .msg.in { background: var(--in-bubble); align-self: flex-start; border-start-start-radius: 2px; }
        .msg.out { background: var(--out-bubble); align-self: flex-end; border-start-end-radius: 2px; }
        .msg.failed { background: var(--danger-soft); }

        .msg .src { font-size: 11px; color: var(--muted); margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
        .msg .foot { font-size: 11px; color: var(--muted); display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; }
        .msg .err { font-size: 12px; color: var(--danger); margin-top: 4px; }
        .msg a { word-break: break-all; }
        .tick.read { color: #34b7f1; }
        .msg code, .note code { font-family: Consolas, 'Courier New', monospace; font-size: 13px; background: #0000000d; border-radius: 4px; padding: 0 4px; direction: ltr; unicode-bidi: isolate; }
        .msg code.mono, .note code.mono { display: block; padding: 4px 6px; white-space: pre-wrap; text-align: left; }
        .quote { display: block; border-inline-start: 3px solid #0000002e; padding-inline-start: 8px; color: var(--muted); }

        .msg .to-task {
            position: absolute; top: 4px; inset-inline-end: -32px;
            width: 26px; height: 26px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--panel); color: var(--task);
            font-size: 12px; display: none;
        }

        .msg.out .to-task { inset-inline-end: auto; inset-inline-start: -32px; }
        .msg:hover .to-task, .msg:focus-within .to-task { display: block; }

        .media-img { display: block; max-width: 260px; width: 100%; border-radius: 6px; margin-bottom: 4px; cursor: zoom-in; }

        .media-file {
            display: flex; align-items: center; gap: 10px;
            background: #00000008; border-radius: 6px; padding: 8px 10px; margin-bottom: 4px;
            text-decoration: none; color: var(--text); min-width: 220px;
        }

        .media-file i { font-size: 26px; color: #d93025; }
        .media-file .fn { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
        .media-file .fs { font-size: 11px; color: var(--muted); }

        .note, .task-card { align-self: center; max-width: 75%; border-radius: 8px; padding: 6px 10px; font-size: 13px; margin: 4px 0; }
        .note { background: #fff8c5; border: 1px dashed #e0c95a; }
        .note .src { font-size: 11px; color: #8a7400; margin-bottom: 2px; }

        .task-card { background: var(--task-soft); border: 1px solid #c9d7f3; display: flex; gap: 10px; align-items: flex-start; min-width: 260px; }
        .task-card.done { opacity: 0.65; }
        .task-card.done .t-title { text-decoration: line-through; }
        .task-card .t-title { font-weight: 500; }
        .task-card .t-sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }

        .chk {
            width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
            border: 2px solid var(--task); background: var(--panel); color: #fff;
            display: inline-flex; align-items: center; justify-content: center; font-size: 10px;
        }

        .chk.on { background: var(--task); }

        .due { white-space: nowrap; }
        .due.late { color: var(--danger); font-weight: 500; }
        .due.today { color: var(--warn); font-weight: 500; }

        .prio { font-size: 11px; border-radius: 4px; padding: 0 6px; }
        .prio.high { background: var(--danger-soft); color: var(--danger); }
        .prio.normal { background: var(--sms-soft); color: var(--sms); }
        .prio.low { background: #eef7ee; color: #3b7a3b; }

        .drop-hint {
            position: absolute; inset: 0; z-index: 30;
            background: #1877f21a; border: 3px dashed var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--accent); pointer-events: none;
        }

        /* ---------- composer ---------- */
        .composer { background: var(--panel); border-top: 1px solid var(--border); padding: 10px 14px; position: relative; }
        .composer-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
        .ctab { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; }
        .ctab.active { background: var(--bg); color: var(--text); font-weight: 500; }
        .ctab.task-tab.active { background: var(--task-soft); color: var(--task); }
        .ctab.note-tab.active { background: #fff8c5; }

        .compose-row { display: flex; gap: 8px; align-items: flex-end; }

        .compose-row textarea {
            flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
            padding: 9px 12px; min-height: 42px; max-height: 140px; outline: none; line-height: 1.5;
        }

        .compose-row textarea:focus { border-color: var(--accent); }
        .composer.note-mode textarea { background: #fffdf0; }

        .round-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; flex-shrink: 0; font-size: 16px; }
        .send-btn { background: var(--accent); color: #fff; }
        .send-btn i { transform: scaleX(-1); }
        .composer.note-mode .send-btn { background: #b89500; }
        .attach-btn { background: var(--bg); color: var(--muted); }
        .attach-btn:hover { color: var(--accent); }
        .attach-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .compose-hint { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; }

        .att-preview {
            display: flex; align-items: center; gap: 10px;
            border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 8px; background: #fafbfc;
        }

        .att-preview img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; }
        .att-preview .pdf { width: 54px; height: 54px; border-radius: 6px; background: var(--danger-soft); color: var(--danger); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .att-preview .info { flex: 1; min-width: 0; }
        .att-preview .info b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .att-preview .info span { font-size: 12px; color: var(--muted); }
        .att-preview .x { border: 0; background: transparent; color: var(--muted); font-size: 16px; width: 30px; height: 30px; }

        .quick {
            position: absolute; bottom: calc(100% + 4px); inset-inline-start: 14px; width: 340px; max-width: calc(100% - 28px);
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12); display: none; overflow: hidden; z-index: 10;
        }

        .quick.show { display: block; }

        .emoji-pop {
            position: absolute; bottom: calc(100% + 4px); inset-inline-start: 14px; width: 340px; max-width: calc(100% - 28px);
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12); display: none; z-index: 10; overflow: hidden;
        }

        .emoji-pop.show { display: flex; flex-direction: column; }
        .emoji-tabs { display: flex; border-bottom: 1px solid var(--border); background: #fafbfc; }
        .emoji-tabs button { flex: 1; border: 0; background: transparent; font-size: 17px; height: 36px; border-bottom: 2px solid transparent; opacity: 0.55; }
        .emoji-tabs button.active { opacity: 1; border-bottom-color: var(--accent); }
        .emoji-tabs button:hover { opacity: 1; }
        .emoji-body { height: 240px; overflow-y: auto; padding: 0 8px 8px; }
        .emoji-sec h5 { font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 2px 4px; position: sticky; top: 0; background: var(--panel); }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
        .emoji-grid button { border: 0; background: transparent; font-size: 22px; height: 36px; border-radius: 6px; padding: 0; }
        .emoji-grid button:hover { background: var(--bg); }

        .fmt-bar { display: flex; gap: 2px; margin-inline-start: auto; }
        .fmt-bar button { border: 0; background: transparent; color: var(--muted); width: 28px; height: 26px; border-radius: 6px; font-size: 13px; }
        .fmt-bar button:hover { background: var(--bg); color: var(--text); }
        .quick-head { font-size: 12px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); }
        .quick-item { padding: 8px 12px; cursor: pointer; }
        .quick-item:hover, .quick-item.hl { background: var(--accent-soft); }
        .quick-item b { font-weight: 500; display: block; }
        .quick-item span { font-size: 12px; color: var(--muted); }

        .task-form { display: grid; gap: 8px; }
        .task-form input[type=text], .task-form input[type=datetime-local], .task-form select {
            height: 38px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; outline: none; background: #fff;
        }

        .task-form input:focus, .task-form select:focus { border-color: var(--task); }
        .task-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .task-row .chip { cursor: pointer; }
        .task-row .chip.active { background: var(--task-soft); border-color: var(--task); color: var(--task); }
        .task-row input[type=datetime-local] { flex: 1; min-width: 190px; }
        .task-row select { width: 130px; }
        .task-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .task-actions span { font-size: 12px; color: var(--muted); }

        .template-box { border: 1px solid #f0d9a8; background: var(--warn-soft); border-radius: 10px; padding: 12px; }
        .template-box p { font-size: 13px; color: var(--warn); margin-bottom: 8px; }
        .template-box select { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; background: #fff; }
        .tpl-preview { background: #fff; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; white-space: pre-wrap; }
        .tpl-vars { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; margin-top: 8px; }
        .tpl-vars input { height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; }
        .tpl-actions { margin-top: 10px; display: flex; justify-content: flex-end; }

        .primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; height: 36px; padding: 0 18px; font-weight: 500; }
        .primary.task { background: var(--task); }

        .thread-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 10px; }
        .thread-empty i { font-size: 46px; color: #c3ccd6; }

        /* ---------- details panel ---------- */
        .details { background: var(--panel); border-inline-start: 1px solid var(--border); overflow-y: auto; min-height: 0; }
        .d-head { text-align: center; padding: 20px 16px 14px; border-bottom: 1px solid var(--border); }
        .d-head .avatar { width: 64px; height: 64px; font-size: 22px; margin: 0 auto 8px; }
        .d-head .name { font-weight: 700; font-size: 16px; }
        .d-head .phone { color: var(--muted); }
        .d-sec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .d-sec h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .d-sec h3 button { border: 0; background: transparent; color: var(--task); font-size: 12px; }
        .kv { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: 13px; }
        .kv span:first-child { color: var(--muted); }
        .groups { display: flex; flex-wrap: wrap; gap: 6px; }
        .group { background: var(--accent-soft); color: #1559b8; border-radius: 12px; padding: 2px 10px; font-size: 12px; }

        .mini-task { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; font-size: 13px; }
        .mini-task .chk { width: 18px; height: 18px; }
        .mini-task .t-sub { font-size: 12px; color: var(--muted); }

        .danger-btn { width: 100%; border: 1px solid #f3c1bd; background: var(--panel); color: var(--danger); border-radius: 8px; height: 36px; }
        .danger-btn:hover { background: var(--danger-soft); }

        /* ---------- tasks view ---------- */
        .tasks-view { height: 100%; overflow-y: auto; padding: 20px 24px; }
        .tasks-wrap { max-width: 1000px; margin: 0 auto; }

        .tasks-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
        .stat:hover { border-color: var(--accent); }
        .stat .n { font-size: 24px; font-weight: 700; }
        .stat .l { font-size: 13px; color: var(--muted); }
        .stat.late .n { color: var(--danger); }
        .stat.today .n { color: var(--warn); }

        .tasks-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .tasks-toolbar .search { background: var(--panel); border: 1px solid var(--border); width: 260px; }
        .tasks-toolbar select { height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; background: #fff; }

        .t-group { margin-bottom: 16px; }
        .t-group h4 { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
        .t-group h4.late { color: var(--danger); }

        .t-row {
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 14px; display: flex; gap: 12px; align-items: center; margin-bottom: 6px;
        }

        .t-row.done { opacity: 0.6; }
        .t-row.done .t-title { text-decoration: line-through; }
        .t-row .t-main { flex: 1; min-width: 0; }
        .t-row .t-title { font-weight: 500; }
        .t-row .t-sub { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
        .t-row .contact-link { color: var(--accent); cursor: pointer; }
        .t-row .contact-link:hover { text-decoration: underline; }
        .t-row .acts { display: flex; gap: 6px; }

        .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

        .lightbox { position: fixed; inset: 0; background: #000c; z-index: 100; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
        .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #1c2b3a; color: #fff; padding: 8px 16px; border-radius: 8px;
            font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200;
        }

        .toast.show { opacity: 1; }

        /* ---------- responsive ---------- */
        @media (max-width: 1200px) {
            .inbox, .inbox.no-details { grid-template-columns: 300px minmax(0, 1fr); }
            .details { display: none; }
        }

        @media (max-width: 760px) {
            .inbox, .inbox.no-details, .inbox.nothing { grid-template-columns: 1fr; }
            .inbox .thread { display: none; }
            .inbox.show-thread .list { display: none; }
            .inbox.show-thread .thread { display: flex; }
            .icon-btn.back { display: inline-flex; }
            .icon-btn .lbl { display: none; }
            .thread-head { gap: 8px; padding: 8px 10px; }
            .msg { max-width: 85%; }
            .msg .to-task { display: none !important; }
            .messages { padding: 12px; }
            .topbar h1 { display: none; }
            .tasks-view { padding: 12px; }
            .tasks-toolbar .search { width: 100%; }
        }

                sx.fillText('G', s / 2, s / 2 + s * 0.05);

                var tile = document.createElement('canvas');
                tile.width = 260; tile.height = 260;
                var tx = tile.getContext('2d');
                [[30, 30, 46, -14], [160, 20, 34, 12], [95, 120, 58, 6], [10, 175, 32, 20], [190, 165, 44, -8], [215, 95, 24, -20]].forEach(function (p) {
                    tx.save();
                    tx.translate(p[0] + p[2] / 2, p[1] + p[2] / 2);
                    tx.rotate(p[3] * Math.PI / 180);
                    tx.drawImage(src, -p[2] / 2, -p[2] / 2, p[2], p[2]);
                    tx.restore();
                });
                gPattern = 'url(' + tile.toDataURL() + ')';
                var m = document.getElementById('messages');
                if (m) m.style.backgroundImage = gPattern;
            };
            // wait for Heebo so the "G" is not drawn in the fallback font
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw, draw);
            else draw();
        }

        // ======================================================================
        // conversation list
        // ======================================================================
        function renderList() {
            var q = state.search.trim();
            var list = convs.filter(function (c) {
                if (state.statusFilter === 'unread' && !c.unread) return false;
                if (state.statusFilter === 'open' && c.status !== 'open') return false;
                if (state.statusFilter === 'closed' && c.status !== 'closed') return false;
                if (state.channelFilter !== 'all' && c.channel !== state.channelFilter) return false;
                if (q) {
                    var hay = c.name + ' ' + c.phone.replace(/-/g, '') + ' ' + c.messages.map(function (m) { return m.text || ''; }).join(' ');
                    if (hay.indexOf(q.replace(/-/g, '')) === -1 && hay.indexOf(q) === -1) return false;
                }
                return true;
            });

            var pinned = list.filter(function (c) { return c.pin; }).sort(function (a, b) { return a.pin - b.pin; });
            var rest = list.filter(function (c) { return !c.pin; }).sort(function (a, b) { return lastMsg(b).time - lastMsg(a).time; });

            var html = '';
            if (pinned.length) {
                html += '<div class="sec-label"><i class="fa-solid fa-thumbtack"></i> מוצמדות (' + pinned.length + '/' + MAX_PINS + ')</div>';
                pinned.forEach(function (c) { html += convHtml(c); });
                if (rest.length) html += '<div class="sec-label">כל השיחות</div>';
            }
            rest.forEach(function (c) { html += convHtml(c); });

            var focused = document.activeElement && document.activeElement.classList.contains('conv') ? document.activeElement.getAttribute('data-id') : null;
            document.getElementById('convList').innerHTML = html || '<div class="empty-list">לא נמצאו שיחות</div>';
            if (focused) { var f = document.querySelector('.conv[data-id="' + focused + '"]'); if (f) f.focus(); }
            renderCounts();
        }

        function convHtml(c) {
            var lm = lastMsg(c);
            var left = windowLeftMin(c);
            var prefix = lm.dir === 'out' ? '<i class="fa-solid fa-reply" style="font-size:10px"></i> ' : '';
            var preview = lm.media ? (lm.media.type === 'image' ? '<i class="fa-regular fa-image"></i> ' : '<i class="fa-regular fa-file-pdf"></i> ') + esc(lm.text || lm.media.name) : esc(lm.text);
            var ot = openTasksOf(c.id);
            var late = ot.some(function (t) { return taskState(t) === 'late'; });

            var pinCtl = c.pin
                ? '<button class="pin-num" data-pinmenu="' + c.id + '" title="שינוי מיקום ההצמדה" aria-label="שינוי מיקום ההצמדה"><i class="fa-solid fa-thumbtack"></i>' + c.pin + '</button>'
                : '<button class="pin-btn" data-pin="' + c.id + '" title="הצמדה למעלה" aria-label="הצמדה למעלה"><i class="fa-solid fa-thumbtack"></i></button>';

            var menu = '';
            if (state.pinMenu === c.id) {
                menu = '<div class="pin-menu">';
                for (var i = 1; i <= MAX_PINS; i++) {
                    menu += '<div data-pinto="' + i + '" data-conv="' + c.id + '" class="' + (c.pin === i ? 'cur' : '') + '">מיקום ' + i + (c.pin === i ? ' (נוכחי)' : '') + '</div>';
                }
                menu += '<div class="unpin" data-unpin="' + c.id + '"><i class="fa-solid fa-xmark"></i> ביטול הצמדה</div></div>';
            }

            return '<div class="conv' + (c.unread ? ' unread' : '') + (c.pin ? ' pinned' : '') + (state.selected === c.id ? ' selected' : '') + '" data-id="' + c.id + '" tabindex="0" role="button" aria-label="' + esc('שיחה עם ' + c.name + (c.unread ? ', ' + c.unread + ' הודעות שלא נקראו' : '')) + '">' +
                '<div class="avatar">' + initials(c.name) +
                '<span class="ch ' + c.channel + '"><i class="' + (c.channel === 'wa' ? 'fa-brands fa-whatsapp' : 'fa-solid fa-comment-sms') + '"></i></span></div>' +
                '<div class="conv-main">' +
                '<div class="conv-row"><span class="conv-name">' + esc(c.name) + '</span><span class="conv-time">' + listTime(lm.time) + '</span></div>' +
                '<div class="conv-row"><span class="conv-preview">' + prefix + preview + '</span>' + (c.unread ? '<span class="badge">' + c.unread + '</span>' : '') + '</div>' +
                '<div class="conv-meta">' +
                (c.status === 'closed' ? '<span class="tag closed">סגורה</span>' : '') +
                (c.optedOut ? '<span class="tag optout"><i class="fa-solid fa-ban"></i> הוסר מדיוור</span>' : '') +
                (left > 0 ? '<span class="tag window"><i class="fa-regular fa-clock"></i> חלון פתוח ' + fmtLeft(left) + '</span>' : '') +
                (ot.length ? '<span class="tag tasks' + (late ? ' late' : '') + '"><i class="fa-solid fa-list-check"></i> ' + ot.length + (late ? ' · באיחור' : '') + '</span>' : '') +
                '</div></div>' + pinCtl + menu + '</div>';
        }

        // ---------- pins ----------
        function pinConv(id) {
            var used = convs.filter(function (c) { return c.pin; }).length;
            if (used >= MAX_PINS) { toast('אפשר להצמיד עד ' + MAX_PINS + ' שיחות. בטלו הצמדה קודם.'); return; }
            convById(id).pin = used + 1;
            toast('השיחה הוצמדה למעלה');
            renderAll();
        }

        function unpinConv(id) {
            var c = convById(id), old = c.pin;
            c.pin = 0;
            convs.forEach(function (x) { if (x.pin > old) x.pin--; });
            state.pinMenu = null;
            toast('ההצמדה בוטלה');
            renderAll();
        }

        // move a pinned conversation to a position; the others shift
        function movePin(id, to) {
            var c = convById(id);
            var order = convs.filter(function (x) { return x.pin && x.id !== id; }).sort(function (a, b) { return a.pin - b.pin; });
            to = Math.min(to, order.length + 1);
            order.splice(to - 1, 0, c);
            order.forEach(function (x, i) { x.pin = i + 1; });
            state.pinMenu = null;
            renderAll();
        }

        // ======================================================================
        // thread
        // ======================================================================
        function timeline(c) {
            var items = c.messages.map(function (m) { return { kind: m.note ? 'note' : 'msg', time: m.time, m: m }; });
            tasks.filter(function (t) { return t.convId === c.id; }).forEach(function (t) { items.push({ kind: 'task', time: t.created, t: t }); });
            return items.sort(function (a, b) { return a.time - b.time; });
        }

        function renderThread() {
            var c = convById(state.selected);
            var th = document.getElementById('thread');
            if (!c) return;

            // re-render of the same conversation (new message, status update):
            // keep everything typed in the composer and the scroll position
            var same = th.getAttribute('data-conv') == c.id;
            var keep = same && th.getAttribute('data-mode') === state.mode ? snapshotComposer() : null;
            var oldBox = document.getElementById('messages');
            var oldScroll = same && oldBox ? oldBox.scrollTop : null;
            var atBottom = !oldBox || oldBox.scrollHeight - oldBox.scrollTop - oldBox.clientHeight < 60;
            th.setAttribute('data-conv', c.id);
            th.setAttribute('data-mode', state.mode);

            var left = windowLeftMin(c);
            state.windowOpen = left > 0;
            var bar;
            if (c.channel === 'sms') bar = '<div class="window-bar sms"><i class="fa-solid fa-comment-sms"></i> שיחת SMS · ' + (SMS_FACTOR > 1 ? 'כל ' + SMS_FACTOR + ' מקטעים נחשבים הודעה אחת לחיוב' : 'כל מקטע נחשב הודעה לחיוב') + ' · אין שליחת קבצים</div>';
            else if (left > 0) bar = '<div class="window-bar open" id="windowBar"><i class="fa-regular fa-clock"></i><span>חלון המענה פתוח · אפשר לשלוח הודעות רגילות וקבצים, לא רק תבניות, עוד <span id="windowLeft">' + fmtLeft(left) + '</span> שעות</span></div>';
            else bar = '<div class="window-bar closed"><i class="fa-solid fa-lock"></i> עברו 24 שעות מההודעה האחרונה של הלקוח · אפשר לשלוח רק תבנית מאושרת</div>';

            // removed from the mailing list: warn; customer wrote "הסר": offer to remove
            if (c.optedOut) bar += '<div class="window-bar optout"><i class="fa-solid fa-ban"></i> הלקוח הוסר מרשימת התפוצה · מותר לשלוח לו רק הודעות שירות, לא פרסום</div>';
            else if (asksOptOut(c)) bar += '<div class="window-bar suggest"><i class="fa-solid fa-circle-exclamation"></i> הלקוח ביקש הסרה מדיוור<button id="optOutQuick">הסרה מרשימת התפוצה</button></div>';

            var html = c.older.length
                ? '<div class="load-older"><button id="loadOlder"' + (state.loadingOlder === c.id ? ' disabled><i class="fa-solid fa-spinner fa-spin"></i> טוען הודעות...' : '><i class="fa-solid fa-clock-rotate-left"></i> טעינת הודעות קודמות') + '</button></div>'
                : '<div class="history-start">תחילת השיחה</div>';
            var lastDay = null;
            timeline(c).forEach(function (it) {
                if (!lastDay || !sameDay(lastDay, it.time)) { html += '<div class="day">' + dayLabel(it.time) + '</div>'; lastDay = it.time; }

                if (it.kind === 'note') {
                    html += '<div class="note"><div class="src"><i class="fa-regular fa-note-sticky"></i> הערה פנימית · ' + hhmm(it.time) + '</div>' + richText(it.m.text) + '</div>';
                    return;
                }

                if (it.kind === 'task') {
                    var t = it.t;
                    html += '<div class="task-card' + (t.done ? ' done' : '') + '">' +
                        '<button class="chk' + (t.done ? ' on' : '') + '" data-toggletask="' + t.id + '" title="' + (t.done ? 'סימון כפתוחה' : 'סימון כבוצעה') + '" aria-label="' + (t.done ? 'סימון כפתוחה' : 'סימון כבוצעה') + '"><i class="fa-solid fa-check"></i></button>' +
                        '<div><div class="t-title">' + esc(t.title) + '</div>' +
                        '<div class="t-sub"><span><i class="fa-solid fa-list-check"></i> משימה</span>' + dueLabel(t) + prioTag(t.prio) + '</div></div></div>';
                    return;
                }

                var m = it.m, tick = '';
                if (m.dir === 'out') {
                    if (m.status === 'read') tick = '<i class="fa-solid fa-check-double tick read" title="נקרא"></i>';
                    else if (m.status === 'delivered') tick = '<i class="fa-solid fa-check-double tick" title="נמסר"></i>';
                    else if (m.status === 'failed') tick = '<i class="fa-solid fa-circle-exclamation" style="color:var(--danger)" title="נכשל"></i>';
                    else tick = '<i class="fa-solid fa-check tick" title="נשלח"></i>';
                }

                var media = '';
                if (m.media && m.media.type === 'image') {
                    media = '<img class="media-img" src="' + esc(m.media.url) + '" alt="' + esc(m.media.name) + '" data-zoom="1">';
                } else if (m.media && m.media.type === 'pdf') {
                    media = '<a class="media-file" href="' + esc(m.media.url) + '" target="_blank" rel="noopener"><i class="fa-regular fa-file-pdf"></i>' +
                        '<div><div class="fn">' + esc(m.media.name) + '</div><div class="fs">PDF' + (m.media.size ? ' · ' + fmtSize(m.media.size) : '') + '</div></div></a>';
                }

                var idx = c.messages.indexOf(m);
                html += '<div class="msg ' + m.dir + (m.status === 'failed' ? ' failed' : '') + '">' +
                    '<button class="to-task" data-msgtask="' + idx + '" title="יצירת משימה מההודעה" aria-label="יצירת משימה מההודעה"><i class="fa-solid fa-list-check"></i></button>' +
                    (m.srcLabel ? '<div class="src"><i class="fa-solid fa-bullhorn"></i>' + esc(m.srcLabel) + '</div>' : '') +
                    media + (m.text ? msgHtml(m.text, c.channel) : '') +
                    '<div class="foot">' + hhmm(m.time) + ' ' + tick + '</div>' +
                    (m.error ? '<div class="err">' + esc(m.error) + '</div>' : '') +
                    '</div>';
            });

            th.innerHTML =
                '<div class="thread-head">' +
                '<button class="icon-btn back" id="backBtn" title="חזרה לרשימה" aria-label="חזרה לרשימה"><i class="fa-solid fa-arrow-right"></i></button>' +
                '<div class="avatar">' + initials(c.name) + '</div>' +
                '<div class="who"><div class="name">' + esc(c.name) + '</div><div class="sub"><span class="ltr">' + esc(c.phone) + '</span> · ' + (c.channel === 'wa' ? 'WhatsApp' : 'SMS') + '</div></div>' +
                '<button class="icon-btn' + (c.pin ? ' on' : '') + '" id="pinToggle" title="' + (c.pin ? 'ביטול הצמדה' : 'הצמדה למעלה') + '"><i class="fa-solid fa-thumbtack"></i><span class="lbl">' + (c.pin ? 'מוצמדת ' + c.pin : 'הצמדה') + '</span></button>' +
                '<button class="icon-btn" id="toggleStatus">' + (c.status === 'open'
                    ? '<i class="fa-solid fa-check" title="סימון כסגורה"></i><span class="lbl">סימון כסגורה</span>'
                    : '<i class="fa-solid fa-rotate-left" title="פתיחה מחדש"></i><span class="lbl">פתיחה מחדש</span>') + '</button>' +
                '<button class="icon-btn" id="toggleDetails" title="פרטי איש קשר" aria-label="פרטי איש קשר"><i class="fa-regular fa-id-card"></i></button>' +
                '</div>' + bar +
                '<div class="messages" id="messages">' + html + '</div>' +
                composerHtml(c, left);

            var box = document.getElementById('messages');
            if (gPattern) box.style.backgroundImage = gPattern;
            // stay where the user was reading, unless they were at the bottom or just sent something
            box.scrollTop = (oldScroll === null || atBottom || state.stickBottom) ? box.scrollHeight : oldScroll;
            state.stickBottom = false;

            bindThread(c, left);
            if (keep) restoreComposer(keep);
        }

        // the customer's last message is an opt-out request
        function asksOptOut(c) {
            var ins = c.messages.filter(function (m) { return m.dir === 'in'; });
            var last = ins.length ? (ins[ins.length - 1].text || '').trim() : '';
            return /^(הסר|הסירו|הסרה|הסירו אותי|stop|unsubscribe)[.!]?$/i.test(last);
        }

        function optOut(c) {
            c.optedOut = true;
            toast('איש הקשר הוסר מרשימת התפוצה');
            renderAll();
        }

        // composer fields (reply text, task form, template variables) by id or data-v
        function snapshotComposer() {
            var snap = { fields: [], focus: null, due: null };
            Array.prototype.forEach.call(document.querySelectorAll('#thread .composer input, #thread .composer textarea, #thread .composer select'), function (el) {
                var key = el.id || (el.getAttribute('data-v') ? 'v' + el.getAttribute('data-v') : null);
                if (!key || el.type === 'file') return;
                snap.fields.push({ key: key, value: el.value });
                if (document.activeElement === el) snap.focus = key;
            });
            var chip = document.querySelector('#dueChips .chip.active');
            snap.due = chip ? chip.getAttribute('data-due') : '';
            return snap;
        }

        function restoreComposer(snap) {
            var find = function (key) {
                return key.charAt(0) === 'v' && /^v\d+$/.test(key)
                    ? document.querySelector('#tplVars input[data-v="' + key.slice(1) + '"]')
                    : document.getElementById(key);
            };
            // template first: changing it redraws the variable inputs
            var tpl = snap.fields.filter(function (f) { return f.key === 'tplSelect'; })[0];
            var sel = document.getElementById('tplSelect');
            if (tpl && sel && sel.value !== tpl.value) { sel.value = tpl.value; sel.onchange(); }
            snap.fields.forEach(function (f) {
                var el = find(f.key);
                if (!el || f.key === 'tplSelect') return;
                el.value = f.value;
                if (el.oninput) el.oninput();
            });
            var chips = document.getElementById('dueChips');
            if (chips) Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (x) {
                x.classList.toggle('active', x.getAttribute('data-due') === snap.due);
            });
            if (snap.focus && find(snap.focus)) find(snap.focus).focus();
        }

        function composerHtml(c, left) {
            var mode = state.mode;
            var mustTemplate = c.channel === 'wa' && left <= 0 && mode === 'reply';

            var tabsOpen = '<div class="composer-tabs">' +
                '<button class="ctab' + (mode === 'reply' ? ' active' : '') + '" data-mode="reply">תשובה ללקוח</button>' +

                '<button class="ctab note-tab' + (mode === 'note' ? ' active' : '') + '" data-mode="note"><i class="fa-regular fa-note-sticky"></i> הערה פנימית</button>';
            var tabs = tabsOpen + '</div>';

            if (mode === 'task') {
                return '<div class="composer">' + tabs +
                    '<div class="task-form">' +
